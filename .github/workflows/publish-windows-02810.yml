name: Publicar Printly Windows 0.2.8.10

on:
  push:
    paths:
      - '.github/workflows/publish-windows-02810.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador
        run: |
          python -m pip install --quiet gdown
          mkdir -p downloads
          gdown 1ZrdnUHNwBAUh90_e99Q0c9FanHP_9pU6 -O downloads/Printly_Setup_v0.2.8.10.exe
          test "$(stat -c%s downloads/Printly_Setup_v0.2.8.10.exe)" -eq 46648964
          echo "dd864ee815adb9d25cb4ac897fe78d650440a0cde2cbc489f8b17b1387fca9ae  downloads/Printly_Setup_v0.2.8.10.exe" | sha256sum -c -
      - name: Publicar e limpar rotina temporaria
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add downloads/Printly_Setup_v0.2.8.10.exe
          git rm .github/workflows/publish-windows-02810.yml
          git commit -m "Publica Printly Windows v0.2.8.10"
          git push
