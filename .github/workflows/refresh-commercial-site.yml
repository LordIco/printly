name: Atualizar site comercial Printly

on:
  push:
    paths:
      - '.github/workflows/refresh-commercial-site.yml'
      - '.github/scripts/update_site.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes
        run: python .github/scripts/update_site.py
      - name: Publicar
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add index.html en/index.html es/index.html termos.html privacidade.html acesso/index.html assets/css/styles.css assets/js/download-config.js
          git rm .github/workflows/refresh-commercial-site.yml .github/scripts/update_site.py
          git commit -m "Alinha site ao teste de 15 dias e licença única de R$ 67,90"
          git push
