name: Publicar Printly Windows 0.2.8.9

on:
  push:
    paths:
      - '.github/workflows/publish-windows-0289.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador
        run: |
          python -m pip install --quiet gdown
          mkdir -p downloads
          gdown 17yWahZXIwqAtifQSObOxrufHXqIPiYGJ -O downloads/Printly_Setup_v0.2.8.9.exe
          test "$(stat -c%s downloads/Printly_Setup_v0.2.8.9.exe)" -eq 46644565
          echo "8dd9188b9b82d839f9b32f43370e3330d34cacf608c9d7df024a17e898f957f9  downloads/Printly_Setup_v0.2.8.9.exe" | sha256sum -c -
      - name: Publicar e limpar rotina temporaria
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add downloads/Printly_Setup_v0.2.8.9.exe
          git rm .github/workflows/publish-windows-0289.yml
          git commit -m "Publica Printly Windows v0.2.8.9"
          git push
