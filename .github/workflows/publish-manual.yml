name: Publicar manuais PDF Printly

on:
  push:
    paths:
      - '.manual-source/**'
      - '.github/scripts/build_manuals.py'
      - '.github/workflows/publish-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-manuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências para gerar os PDFs
        run: python -m pip install --disable-pip-version-check reportlab pillow

      - name: Gerar os três manuais PDF ilustrados
        run: python .github/scripts/build_manuals.py

      - name: Direcionar cada idioma para seu próprio PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'Manual_Oficial_Printly_v0.2.2.1_REV4.pdf'
          targets = {
              'index.html': 'Printly_Manual_Oficial_v0.2.8.3_REV6_PT-BR.pdf',
              'en/index.html': 'Printly_Official_Operations_Manual_v0.2.8.3_REV6_EN-US.pdf',
              'es/index.html': 'Printly_Manual_Oficial_de_Operacion_v0.2.8.3_REV6_ES.pdf',
          }
          replacements = {
              'en/index.html': {
                  'PDF manuals (PT-BR)': 'PDF manuals',
                  'User manual (PT-BR)': 'User manual (EN-US)',
              },
              'es/index.html': {
                  'Manuales PDF (PT-BR)': 'Manuales PDF',
              },
          }

          for rel, new in targets.items():
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              text = text.replace(old, new)
              for before, after in replacements.get(rel, {}).items():
                  text = text.replace(before, after)
              p.write_text(text, encoding='utf-8')

          old_pdf = Path('downloads') / old
          if old_pdf.exists():
              old_pdf.unlink()
          old_rev6 = Path('downloads/Manual_Oficial_Printly_v0.2.8.3_REV6.pdf')
          if old_rev6.exists():
              old_rev6.unlink()
          PY

          rm -rf .manual-build

      - name: Commit da publicação
        shell: bash
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Publica manuais Printly v0.2.8.3 REV6 em PT, EN e ES"
          git push
