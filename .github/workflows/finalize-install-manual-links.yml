name: Finalizar links dos manuais de instalação

on:
  push:
    paths:
      - '.github/workflows/finalize-install-manual-links.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar nomes e links
        run: |
          cp downloads/Manual_Instalacao_Printly_Windows.pdf downloads/Manual_Instalacao_Printly_Windows_PT-BR.pdf
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('downloads/Manual_Instalacao_Printly_Windows.pdf','downloads/Manual_Instalacao_Printly_Windows_PT-BR.pdf')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add index.html downloads/Manual_Instalacao_Printly_Windows_PT-BR.pdf
          git commit -m "Finaliza links dos manuais de instalação" || exit 0
          git push
