name: Corrigir diagnóstico do Printly Admin

on:
  push:
    paths:
      - '.github/workflows/patch-admin-health.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir JavaScript e validar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/index.html')
          t=p.read_text(encoding='utf-8')
          marker='\\nasync function healthApi()'
          if marker in t:
              start=t.index(marker)
              end=t.index("function note(el,t,k='ok')",start)
              block=t[start:end].replace('\\n','\n')
              t=t[:start]+block+t[end:]
          p.write_text(t,encoding='utf-8')
          start=t.rfind('<script>')+len('<script>')
          end=t.rfind('</script>')
          Path('/tmp/admin.js').write_text(t[start:end],encoding='utf-8')
          PY
          node --check /tmp/admin.js
      - name: Publicar
        shell: bash
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add admin/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige JavaScript do diagnóstico de integrações"
          git push
