name: Publicar instalador Windows

on:
  push:
    paths:
      - '.github/workflows/publish-windows.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar instalador
        run: |
          python -m pip install --quiet gdown
          mkdir -p downloads
          gdown 1rgWyJNKEojIqovTxU8CDVV5m-hAqNTl8 -O downloads/Printly_Setup_v0.2.8.4.exe
          test "$(stat -c%s downloads/Printly_Setup_v0.2.8.4.exe)" -eq 38341806
      - name: Publicar
        run: |
          git config user.name "IcoLabs Automation"
          git config user.email "icolabsbr@gmail.com"
          git add downloads/Printly_Setup_v0.2.8.4.exe
          git commit -m "Publica Printly Windows v0.2.8.4"
          git push
